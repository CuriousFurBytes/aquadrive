{# Hidden radios drive the theme and accent via :has(#id:checked) in CSS. #}
<input type="radio"
       name="theme"
       id="theme-light"
       class="switcher-input"
       aria-hidden="true">
<input type="radio"
       name="theme"
       id="theme-dark"
       class="switcher-input"
       aria-hidden="true">
<input type="radio"
       name="accent"
       id="accent-blue"
       class="switcher-input"
       aria-hidden="true"
       checked>
<input type="radio"
       name="accent"
       id="accent-purple"
       class="switcher-input"
       aria-hidden="true">
<input type="radio"
       name="accent"
       id="accent-cyan"
       class="switcher-input"
       aria-hidden="true">
<input type="radio"
       name="accent"
       id="accent-rose"
       class="switcher-input"
       aria-hidden="true">
